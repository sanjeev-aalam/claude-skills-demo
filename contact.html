<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Northwind Labs</title>
  <meta name="description" content="Get in touch with the Northwind Labs team. We would love to hear from you.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body id="top">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Northwind Labs</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <nav>
        <ul class="nav-list" id="main-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Get in touch</h1>
        <p>Questions, feedback or just want to say hello? Drop us a line.</p>
      </div>
    </section>

    <section class="contact-section">
      <div class="container">
        <h3>Send us a message</h3>
        <div class="contact-layout">

          <form class="contact-form" action="#" method="post">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
              <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn">Send message</button>
          </form>

          <div class="office-illustration">
            <svg width="280" height="220" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg">
              <rect x="40" y="60" width="200" height="140" rx="4" fill="#e2e8f0"/>
              <rect x="60" y="80" width="40" height="40" rx="2" fill="#bfdbfe"/>
              <rect x="120" y="80" width="40" height="40" rx="2" fill="#bfdbfe"/>
              <rect x="180" y="80" width="40" height="40" rx="2" fill="#bfdbfe"/>
              <rect x="110" y="150" width="60" height="50" rx="2" fill="#93c5fd"/>
              <polygon points="140,20 260,60 20,60" fill="#2563eb"/>
              <circle cx="230" cy="30" r="15" fill="#fbbf24"/>
            </svg>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2026 Northwind Labs. Built with care in Portland, OR.</p>
      <p><a href="#top">Back to top</a></p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
